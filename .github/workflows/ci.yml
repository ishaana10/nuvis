name: Nuvis CI

on:
  push:
    branches: [ main, master, security-hardening-improvements ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, ctype
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP Linting
        run: |
          find core api modules -name "*.php" -print0 | xargs -0 -n 1 php -l

      - name: Run PHPUnit Tests
        run: vendor/bin/phpunit
